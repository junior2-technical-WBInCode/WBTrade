# Render Blueprint - automatyczna konfiguracja serwisów
services:
  # API Backend
  - type: web
    name: wbtrade-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # Płatny plan - serwis NIE usypia się
    region: frankfurt # EU region dla lepszej wydajności w Polsce
    branch: main # Branch główny z wszystkimi poprawkami
    healthCheckPath: /health
    autoDeploy: true # Automatyczne wdrożenia przy push do głównej gałęzi
    
    # Zmienne środowiskowe - WAŻNE: ustaw je w panelu Render
    envVars:
      - key: NODE_ENV
        value: production

      # AUDYT V-05: zadania tła przeniesione do serwisu wbtrade-worker.
      # Ustaw na "false" (lub usuń), aby tymczasowo wrócić do trybu in-process.
      - key: DISABLE_IN_PROCESS_WORKERS
        value: "true"
      
      - key: APP_PORT
        value: 5000
      
      - key: PORT
        fromService:
          type: web
          name: wbtrade-api
          property: port
        
      - key: APP_URL
        # Zostanie automatycznie ustawione przez Render
        sync: false
        
      - key: FRONTEND_URL
        # Ustaw URL swojego frontendu po wdrożeniu
        sync: false
        
      - key: DATABASE_URL
        # Twój URL bazy Neon (skopiuj z .env)
        sync: false
        
      - key: REDIS_URL
        # Twój URL Redis Upstash (skopiuj z .env)
        sync: false
        
      - key: JWT_SECRET
        # Ustaw bezpieczny klucz JWT (min. 32 znaki)
        sync: false
        
      - key: JWT_ACCESS_SECRET
        # Ten sam co JWT_SECRET lub osobny klucz dla access tokenów
        sync: false
        
      - key: JWT_REFRESH_SECRET
        # Ustaw bezpieczny klucz dla refresh tokenów
        sync: false
        
      - key: GOOGLE_CLIENT_ID
        # Google OAuth Client ID z console.cloud.google.com
        sync: false
        
      - key: GOOGLE_CLIENT_SECRET
        # Google OAuth Client Secret
        sync: false
        
      - key: GOOGLE_REDIRECT_URI
        # np. https://wbtrade-api.onrender.com/api/auth/google/callback
        sync: false
        
      - key: PAYU_POS_ID
        sync: false
        
      - key: PAYU_CLIENT_ID
        sync: false
        
      - key: PAYU_CLIENT_SECRET
        sync: false
        
      - key: PAYU_SECOND_KEY
        sync: false
        
      - key: PAYU_SANDBOX
        value: false # Na produkcji ustaw na false
        
      - key: MEILI_HOST
        # URL do Meilisearch (można użyć Render lub zewnętrznego serwisu)
        sync: false
        
      - key: MEILI_MASTER_KEY
        # Bezpieczny klucz do Meilisearch
        sync: false
        
      - key: RESEND_API_KEY
        # Klucz API Resend do wysyłania emaili (wymagany!)
        sync: false

      # Faktury zbiorcze B2B - produkcyjne konto Fakturowni
      - key: FAKTUROWNIA_DOMAIN
        value: wb-partners

      - key: FAKTUROWNIA_API_TOKEN
        # Sekretny token produkcyjnego konta, ustawiany wyłącznie w panelu Render
        sync: false
        
      - key: FROM_EMAIL
        value: "WB Trade <noreply@wb-trade.pl>"
        
      # Legacy SMTP (nie używane - aplikacja używa Resend)
      - key: SMTP_HOST
        # Konfiguracja email (np. SendGrid, Postmark)
        sync: false
        
      - key: SMTP_PORT
        value: 587
        
      - key: SMTP_USER
        sync: false
        
      - key: SMTP_PASS
        sync: false
        
      - key: SMTP_FROM
        value: "WB Trade <noreply@wbtrade.pl>"

  # Worker — zadania tła (audyt V-05: izolacja od procesu API)
  # Baselinker sync, payment reminders, newsletter, loyalty/affiliate crony,
  # delivery-delay detection. Ten sam obraz Dockera co API, inny entrypoint.
  - type: worker
    name: wbtrade-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/worker.js
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        # Ten sam URL bazy Neon co w API
        sync: false

      - key: REDIS_URL
        # Ten sam Redis Upstash co w API (wspólne kolejki BullMQ)
        sync: false

      - key: MEILI_HOST
        sync: false

      - key: MEILI_MASTER_KEY
        sync: false

      - key: BASELINKER_ENCRYPTION_KEY
        # Ten sam klucz co w API (odszyfrowanie tokenu Baselinker)
        sync: false

      - key: RESEND_API_KEY
        # Wysyłka e-maili z workerów (przypomnienia, newsletter)
        sync: false

      - key: FROM_EMAIL
        value: "WB Trade <noreply@wb-trade.pl>"

      - key: FRONTEND_URL
        # Linki w e-mailach
        sync: false

  # Meilisearch
  - type: web
    name: wbtrade-meilisearch
    runtime: docker
    dockerfilePath: ./Dockerfile.meilisearch
    plan: starter
    region: frankfurt
    branch: main
    disk:
      name: meilisearch-data
      mountPath: /data.ms
      sizeGB: 1
    envVars:
      - key: MEILI_MASTER_KEY
        # Ten sam klucz co w API
        sync: false

databases:
  # Jeśli nie używasz Neon, możesz utworzyć bazę na Render
